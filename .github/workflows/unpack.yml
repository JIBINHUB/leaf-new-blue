name: Publish website source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unpack.yml

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reassemble and extract website
        run: |
          cat leaf-chunk-* > /tmp/leaf-new-blue-source.tar.gz
          tar -xzf /tmp/leaf-new-blue-source.tar.gz -C .
          rm -f leaf-chunk-*

      - name: Publish clean website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Leaf Creationism website source"
          git push origin main
