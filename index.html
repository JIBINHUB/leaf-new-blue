<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--@SEO_HEAD-->
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />
    <link rel="dns-prefetch" href="https://ik.imagekit.io" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { min-height: 100%; background: #050505; }
      body { margin: 0; }
      /* Static SEO layer: real content for crawlers and no-JS visitors.
         React replaces it on mount, so it must stay lightweight and legible. */
      .seo-static {
        max-width: 60rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        color: #e2e8f0;
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.6;
      }
      .seo-static h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1rem; color: #fff; }
      .seo-static h2 { font-size: 1.35rem; margin: 2.25rem 0 0.75rem; color: #fff; }
      .seo-static h3 { font-size: 1.05rem; margin: 1.25rem 0 0.4rem; color: #fff; }
      .seo-static p { margin: 0 0 0.75rem; }
      .seo-static ul { margin: 0 0 1rem; padding-left: 1.25rem; }
      .seo-static li { margin-bottom: 0.35rem; }
      .seo-static a { color: #60a5fa; }
      .seo-static dt { margin-top: 1rem; }
      .seo-static dd { margin: 0 0 0.75rem; }
      .seo-static address { font-style: normal; }
    </style>
    <meta name="theme-color" content="#1f66e5" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"><!--@SEO_BODY--></div>
    <script type="module" src="/src/App.jsx"></script>
    <script>
      // Register the service worker only in production. On localhost it would
      // serve stale bundles and make dev changes look like they did not apply.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* Offline caching is an enhancement — never block the page on it. */
          });
        });
      }
    </script>
  </body>
</html>
